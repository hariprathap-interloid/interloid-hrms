server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses/error pages.
    server_tokens off;

    # Baseline hardening headers for every response. No CSP here: this template's real
    # backend origin is only known at deploy time (see env-config.js / learning.md), so a
    # correct connect-src can't be hardcoded without risking silently breaking API calls
    # in some deployments. Add a CSP once the deployment's real origins are fixed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Serve prebuilt .gz files (from vite-plugin-compression) when present; otherwise
    # compress on the fly so nothing ships uncompressed.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html (and env-config.js, which is regenerated per container start — see
    # docker/generate-env-config.sh) must never be cached: they're the two files that can
    # legitimately change between deploys of the "same" image/version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /env-config.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
